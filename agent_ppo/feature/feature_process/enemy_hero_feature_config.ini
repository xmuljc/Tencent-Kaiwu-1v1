[feature_config]
enemy_is_alive = one_hot:1:eq
enemy_hp_rate = min_max:0:1
enemy_level = min_max:1:15
enemy_phy_atk = min_max:0:1000
enemy_phy_def = min_max:0:1000
enemy_mgc_atk = min_max:0:1000
enemy_mgc_def = min_max:0:1000
enemy_mov_spd = min_max:0:1500
enemy_kill_cnt = min_max:0:20
enemy_dead_cnt = min_max:0:20
enemy_dist = min_max:0:30000

[feature_functions]
enemy_is_alive = get_enemy_is_alive
enemy_hp_rate = get_enemy_hp_rate
enemy_level = get_enemy_level
enemy_phy_atk = get_enemy_phy_atk
enemy_phy_def = get_enemy_phy_def
enemy_mgc_atk = get_enemy_mgc_atk
enemy_mgc_def = get_enemy_mgc_def
enemy_mov_spd = get_enemy_mov_spd
enemy_kill_cnt = get_enemy_kill_cnt
enemy_dead_cnt = get_enemy_dead_cnt
enemy_dist = get_enemy_dist
