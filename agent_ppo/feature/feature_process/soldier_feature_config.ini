[feature_config]
is_in_exp_range = one_hot:1:eq
is_soldier_alive = one_hot:1:eq  # 小兵是否存活；协议字段 npc_states(sub_type=11).hp，当前只保留 hp>0 的小兵
belong_to_main_camp = one_hot:1:eq  # 小兵是否属于己方阵营；协议字段 npc_states(sub_type=11).camp
location_x = min_max:-10000:10000  # 小兵全局 X 坐标；协议字段 npc_states(sub_type=11).location.x
location_z = min_max:-41000:41000  # 小兵全局 Z 坐标；协议字段 npc_states(sub_type=11).location.z
dist_to_main_hero = min_max:0:30000  # 小兵到己方主英雄距离；由 soldier.location 与 main hero.location 计算
dist_to_enemy_hero = min_max:0:30000  # 小兵到敌方英雄距离；由 soldier.location 与 enemy hero.location 计算
hp = min_max:0:12000  # 小兵当前生命值；协议字段 npc_states(sub_type=11).hp
hp_rate = min_max:0:1  # 小兵生命比例；由 hp/max_hp 计算
max_hp = min_max:0:12000  # 小兵最大生命值；协议字段 npc_states(sub_type=11).max_hp
phy_atk = min_max:0:700  # 小兵物理攻击力；协议字段 npc_states(sub_type=11).phy_atk
kill_income = min_max:0:150  # 击杀小兵收益；协议字段 npc_states(sub_type=11).kill_income
buff_marks = one_hot:1:eq  # 小兵是否存在 buff mark；协议字段 npc_states(sub_type=11).buff_state.buff_marks
friendly_soldier_count = min_max:0:10
enemy_soldier_count = min_max:0:10
nearest_friendly_dist = min_max:0:30000
nearest_enemy_dist = min_max:0:30000

[feature_functions]
is_in_exp_range = get_is_in_exp_range
is_soldier_alive = get_is_soldier_alive
belong_to_main_camp = get_belong_to_main_camp
location_x = get_location_x
location_z = get_location_z
dist_to_main_hero = get_dist_to_main_hero
dist_to_enemy_hero = get_dist_to_enemy_hero
hp = get_hp
hp_rate = get_hp_rate
max_hp = get_max_hp
phy_atk = get_phy_atk
kill_income = get_kill_income
buff_marks = get_buff_marks
friendly_soldier_count = get_friendly_soldier_count
enemy_soldier_count = get_enemy_soldier_count
nearest_friendly_dist = get_nearest_friendly_dist
nearest_enemy_dist = get_nearest_enemy_dist
